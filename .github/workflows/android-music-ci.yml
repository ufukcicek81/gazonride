name: GaZonRide music feature APK test
on:
  push:
    branches: [feature/gazonride-native-tts-duck-fix]
    paths:
      - "android/**"
      - ".github/workflows/android-music-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gazonride-stable-debug-signing-v1
      - name: Generate debug signing key only when cache is unavailable
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=GaZonRide,O=GaZonRide,C=TR" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Prepare launcher icons
        shell: bash
        run: |
          set -e
          cat android/icon_chunks/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/gazonride_launcher.webp
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp /tmp/gazonride_launcher.webp "android/app/src/main/res/mipmap-$density/ic_launcher.webp"
            cp /tmp/gazonride_launcher.webp "android/app/src/main/res/mipmap-$density/ic_launcher_round.webp"
          done
      - name: Build Android music integration
        working-directory: android
        run: gradle --no-daemon assembleDebug -PbuildCode=777 -PbuildName=1.0.music-test
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GaZonRide-Music-Android-CI
          path: android/app/build/outputs/apk/debug/app-debug.apk
