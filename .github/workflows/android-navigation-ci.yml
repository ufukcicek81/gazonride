name: GaZonRide Google Navigation SDK CI
on:
  push:
    branches:
      - feature/gazonride-native-navigation-sdk-20261010
      - feature/gazonride-auto-route-previews
    paths:
      - 'android/**'
      - '.github/workflows/android-navigation-ci.yml'
      - 'index.html'
      - 'gazon-route-picker.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager and install API 36
        shell: bash
        run: |
          set -eu
          echo "Android SDK: ${ANDROID_HOME:-not-set}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            echo "Using Android SDK manager: $SDKMANAGER"
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          else
            echo "No SDK manager on image: Gradle will attempt using preinstalled API 36"
            ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore original debug-signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gazonride-stable-debug-signing-v1
      - name: Ensure original signing certificate exists
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=GaZonRide,O=GaZonRide,C=TR" -keyalg RSA \
              -keysize 2048 -validity 10000
          fi
      - name: Restore GaZonRide launcher logo
        shell: bash
        run: |
          set -eu
          cat android/icon_chunks/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/gazon_nav_launcher.webp
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp /tmp/gazon_nav_launcher.webp "android/app/src/main/res/mipmap-$density/ic_launcher.webp"
            cp /tmp/gazon_nav_launcher.webp "android/app/src/main/res/mipmap-$density/ic_launcher_round.webp"
          done
      - name: Verify navigation key was configured without printing it
        shell: bash
        env:
          GAZONRIDE_NAVIGATION_API_KEY: ${{ secrets.GAZONRIDE_NAVIGATION_API_KEY }}
        run: |
          test -n "$GAZONRIDE_NAVIGATION_API_KEY" || (echo "Navigation SDK secret missing" && exit 1)
          echo "Navigation SDK credential configured"
      - name: Build native Navigation SDK APK
        working-directory: android
        env:
          GAZONRIDE_NAVIGATION_API_KEY: ${{ secrets.GAZONRIDE_NAVIGATION_API_KEY }}
        run: gradle --no-daemon assembleDebug -PbuildCode=112 -PbuildName=1.0.112-route-preview
      - name: Upload test-only Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GaZonRide-Native-Navigation-SDK-Test
          path: android/app/build/outputs/apk/debug/app-debug.apk
