name: Destinations · photos and location check
# Looks up a photo and province-verified coordinates for every 81-province
# destination (Wikipedia + OpenStreetMap) and commits the result back.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/enrich-destinations.js"
      - "scripts/enrich-moto-routes.js"
      - "gazon-moto-routes.json"
      - "scripts/mirror-photos.js"
      - "scripts/fix-bad-photos.js"
      - ".github/workflows/enrich-destinations.yml"
permissions:
  contents: write
concurrency:
  group: enrich-destinations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enrich new or changed moto routes
        run: node scripts/enrich-moto-routes.js
      - name: Replace map/logo images with real photos
        run: node scripts/fix-bad-photos.js
      - name: Mirror photos into the site
        run: |
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          node scripts/mirror-photos.js
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gazon-destinations.json gazon-moto-routes.json docs/destinations-check.md photos
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Destinations: photos and province-checked coordinates (automated)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
