name: GaZonRide 81 İl Gezi Listesi
on:
  push:
    branches:
      - feature/gazonride-ui-travel-catalog
    paths:
      - .github/workflows/import-gazon-destinations.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser requirements
        run: python -m pip install requests beautifulsoup4
      - name: Import and validate Turkey destinations
        run: python scripts/import_gazon_destinations.py
      - name: Commit the validated static catalogue
        run: |
          git config user.name "gazonride-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gazon-destinations.json
          if ! git diff --cached --quiet; then
            git commit -m "Populate complete Turkey travel destinations catalogue"
            git push origin HEAD:feature/gazonride-ui-travel-catalog
          fi
