name: GaZonRide 81 İl Gezi Kartları Denetimi
on:
  push:
    branches: [main]
    paths:
      - 'gazon-destinations.json'
      - 'gazon-destinations.js'
      - 'social.js'
      - 'gazon-guides.js'
      - 'index.html'
      - 'gazon-music.css'
      - 'gazon-guides.css'
      - 'gazon-tour.js'
      - 'gazon-tour.css'
      - 'gazon-tour.test.js'
      - 'gazon-native-route.js'
      - 'gazon-native-route.test.js'
      - '.github/workflows/import-gazon-destinations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check city, card, category and search integrity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('gazon-destinations.json').read_text(encoding='utf-8'))
          cities = data.get('cities', [])
          items = data.get('items', [])
          assert len(cities) == 81 and len(set(cities)) == 81, "Expected exactly 81 unique cities"
          assert len(items) >= 162, "At least two initial entries per city are expected"
          ids = [x['id'] for x in items]
          assert len(ids) == len(set(ids)), "Duplicate card IDs"
          categories = {'Doğa', 'Tarih', 'Keşif', 'Deniz', 'Lezzet', 'Etkinlik'}
          for item in items:
              assert item['city'] in cities, f"Unknown city: {item}"
              assert item['category'] in categories, f"Unknown category: {item}"
              assert item.get('title', '').strip(), f"Missing title: {item}"
              assert item.get('search', '').strip(), f"Missing navigation query: {item}"
          print(f"PASS: {len(items)} cards / {len(cities)} cities; unique IDs and complete fields")
          PY
      - name: Check eight route titles against guide detail entries
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          routes = Path('social.js').read_text(encoding='utf-8')
          guides = Path('gazon-guides.js').read_text(encoding='utf-8')
          entries = [x for x in routes.splitlines() if 'routeKey:' in x]
          assert len(entries) == 8, f'Expected 8 curated routes, got {len(entries)}'
          for entry in entries:
              title = re.search(r'title:"([^"]+)"', entry)
              assert title, f'No route title: {entry[:80]}'
              assert f'"{title.group(1)}":{{' in guides, f'Route missing guide: {title.group(1)}'
          print('PASS: All 8 curated route cards have matching detail pages')
          PY
      - name: JavaScript syntax and ride/photo regression checks
        run: |
          node --check social.js
          node --check gazon-guides.js
          node --check gazon-destinations.js
          node --check gazon-tour.js
          node --check gazon-tour.test.js
          node gazon-tour.test.js
          node --check gazon-native-route.js
          node --check gazon-native-route.test.js
          node gazon-native-route.test.js
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script([^>]*)>([\s\S]*?)</script>', html, flags=re.I)
          scripts = [body for attrs,body in blocks if 'src=' not in attrs.lower()]
          assert len(scripts) == 2, f"Expected 2 inline scripts, found {len(scripts)}"
          for i, code in enumerate(scripts):
              pathlib.Path(f"/tmp/gazonride-inline-{i}.js").write_text(code, encoding="utf-8")
          assert "function resetRideDisplay()" in html
          assert "resetRideDisplay();" in html
          assert 'body.mode-ride .actions{' in html
          assert 'id="grModeTour"' in html
          assert 'id="grTourPanel"' in html
          assert 'gazon-native-route.js?v=' in html
          assert 'gazon-tour.js?v=' in html
          assert 'gazon-tour.css?v=' in html
          tour = pathlib.Path("gazon-tour.js").read_text(encoding="utf-8")
          assert 'forceWeb=forceWeb===true' in html, "Do not pass click events as forceWeb"
          assert 'start.onclick=function(){startPlannedNavigation(false)}' in html
          assert 'addEventListener("click",function(){startPlannedNavigation(false)})' in html
          assert 'GAZON_NAV_BLUE="#1A73E8"' in html
          assert 'function createNavigationPolyline(' in html
          assert 'function removeNavigationPolyline(' in html
          assert 'Google navigasyonu içeride açılır' in html
          assert '"#1A73E8"' in tour, "Tour previews must use blue road lines"
          assert 'Google Haritalar’da turu aç' not in tour
          assert 'id="navRouteMaps"' not in html, "Avoid external Google Maps action in main route chooser"
          print("PASS: Native SDK prioritized; click-event regression and blue route preview checks")

          for name in ("duzce-aktas-kurugol", "ucmakdere-sarkoy"):
              routes = pathlib.Path("social.js").read_text(encoding="utf-8")
              line = next(line for line in routes.splitlines() if f'routeKey:"{name}"' in line)
              assert 'photo:"https://' in line, f"Missing photo for {name}"
              assert 'photoCredit:"https://' in line, f"Missing photo credit for {name}"
          print("PASS: Ride reset, safe button placement and photo sources present")
          PY
          node --check /tmp/gazonride-inline-0.js
          node --check /tmp/gazonride-inline-1.js
