name: GaZonRide 81 İl Gezi Kartları Denetimi
on:
  push:
    branches: [main]
    paths:
      - 'gazon-destinations.json'
      - 'gazon-destinations.js'
      - 'social.js'
      - 'gazon-guides.js'
      - '.github/workflows/import-gazon-destinations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check city, card, category and search integrity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('gazon-destinations.json').read_text(encoding='utf-8'))
          cities = data.get('cities', [])
          items = data.get('items', [])
          assert len(cities) == 81 and len(set(cities)) == 81, "Expected exactly 81 unique cities"
          assert len(items) >= 162, "At least two initial entries per city are expected"
          ids = [x['id'] for x in items]
          assert len(ids) == len(set(ids)), "Duplicate card IDs"
          categories = {'Doğa', 'Tarih', 'Keşif', 'Deniz', 'Lezzet', 'Etkinlik'}
          for item in items:
              assert item['city'] in cities, f"Unknown city: {item}"
              assert item['category'] in categories, f"Unknown category: {item}"
              assert item.get('title', '').strip(), f"Missing title: {item}"
              assert item.get('search', '').strip(), f"Missing navigation query: {item}"
          print(f"PASS: {len(items)} cards / {len(cities)} cities; unique IDs and complete fields")
          PY
      - name: Check eight route titles against guide detail entries
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          routes = Path('social.js').read_text(encoding='utf-8')
          guides = Path('gazon-guides.js').read_text(encoding='utf-8')
          entries = [x for x in routes.splitlines() if 'routeKey:' in x]
          assert len(entries) == 8, f'Expected 8 curated routes, got {len(entries)}'
          for entry in entries:
              title = re.search(r'title:"([^"]+)"', entry)
              assert title, f'No route title: {entry[:80]}'
              assert f'"{title.group(1)}":{{' in guides, f'Route missing guide: {title.group(1)}'
          print('PASS: All 8 curated route cards have matching detail pages')
          PY
