name: Google Maps Diagnostic

on:
  push:
    paths:
      - '.github/workflows/maps-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test Google Maps Platform key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -u
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "SECRET_STATUS=MISSING"
            exit 0
          fi
          echo "SECRET_STATUS=PRESENT"

          echo "=== GEOCODING ==="
          GEO="$(curl -sS --get 'https://maps.googleapis.com/maps/api/geocode/json'             --data-urlencode 'address=Duzce, Turkey'             --data-urlencode "key=$GOOGLE_MAPS_API_KEY")"
          GEO_JSON="$GEO" python3 - <<'PY'
import json, os
d=json.loads(os.environ.get("GEO_JSON","{}"))
print("GEOCODING_STATUS="+str(d.get("status","UNKNOWN")))
if d.get("error_message"):
    print("GEOCODING_ERROR="+str(d["error_message"]))
else:
    print("GEOCODING_RESULTS="+str(len(d.get("results",[]))))
PY

          echo "=== ROUTES ==="
          ROUTES="$(curl -sS -X POST 'https://routes.googleapis.com/directions/v2:computeRoutes'             -H 'Content-Type: application/json'             -H "X-Goog-Api-Key: $GOOGLE_MAPS_API_KEY"             -H 'X-Goog-FieldMask: routes.distanceMeters,routes.duration'             -d '{"origin":{"location":{"latLng":{"latitude":40.8438,"longitude":31.1565}}},"destination":{"location":{"latLng":{"latitude":41.0866,"longitude":31.1162}}},"travelMode":"DRIVE"}')"
          ROUTES_JSON="$ROUTES" python3 - <<'PY'
import json, os
d=json.loads(os.environ.get("ROUTES_JSON","{}"))
if "error" in d:
    e=d["error"]
    print("ROUTES_STATUS="+str(e.get("status","ERROR")))
    print("ROUTES_CODE="+str(e.get("code","")))
    print("ROUTES_ERROR="+str(e.get("message","")))
else:
    print("ROUTES_STATUS=OK")
    print("ROUTES_COUNT="+str(len(d.get("routes",[]))))
PY
