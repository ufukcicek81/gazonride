<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><title>GaZonRide Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0,0" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f6f8;color:#171a1f}.wrap{width:min(900px,100%);margin:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 30px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.head h1{margin:0;font-size:25px}.head button,.btn{border:1px solid #dce1e7;background:#fff;border-radius:12px;padding:10px 12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.stat{background:#fff;border:1px solid #dfe3e8;border-radius:16px;padding:14px}.stat b{display:block;font-size:24px}.stat small{color:#707985}.card{background:#fff;border:1px solid #dfe3e8;border-radius:17px;padding:14px;margin-top:9px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff3cd;color:#745600;font-size:9px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{border:0;border-radius:11px;padding:10px;font-weight:900}.ok{background:#1d8b4b;color:#fff}.no{background:#303640;color:#fff}.muted{color:#737b85;font-size:11px}.empty,.denied{padding:28px;text-align:center;color:#737b85;background:#fff;border:1px dashed #dfe3e8;border-radius:17px}.danger{color:#a82d2d}.adminClaim{margin-top:14px;background:#ff5a1f;color:#fff;border:0;border-radius:13px;padding:13px 16px;font-weight:900}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="head"><div><div class="muted">GAZONRIDE</div><h1>Admin Paneli</h1></div><button onclick="location.href='index.html'">Uygulamaya Dön</button></div><div id="app"><div class="empty">Yükleniyor...</div></div></div>
<script src="supabase-config.js?v=20261008-audit1"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20261008-sb3"></script>
<script>
(async function(){
 var app=document.getElementById("app");
 await GaZonAuth.ready;
 if(!GaZonAuth.state.user)return;
 if(GaZonAuth.state.role!=="admin"){
   app.innerHTML='<div class="denied"><h2>Admin yetkisi gerekli</h2><div class="muted">Bu hesap GaZonRide yönetici hesabı değil.</div></div>';
   return;
 }
 var client=GaZonAuth.client,users=[],subs=[];
 function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
 async function load(){
   var ur=await client.rpc("admin_list_users");if(ur.error)throw ur.error;users=ur.data||[];
   var sr=await client.from("submissions").select("*").order("created_at",{ascending:false});if(sr.error)throw sr.error;subs=sr.data||[];
   render();
 }
 function render(){
   var pending=subs.filter(function(x){return x.status==="pending"}),approved=subs.filter(function(x){return x.status==="approved"});
   app.innerHTML='<div class="grid"><div class="stat"><b>'+users.length+'</b><small>Üye</small></div><div class="stat"><b>'+pending.length+'</b><small>Onay bekleyen</small></div><div class="stat"><b>'+approved.length+'</b><small>Onaylanan</small></div></div><h3>Onay Kuyruğu</h3>'+
   (pending.length?pending.map(function(s){var photos=Array.isArray(s.photos)?s.photos:[],stops=Array.isArray(s.stops)?s.stops:[],meta=s.ride_meta||{};return '<div class="card"><b>'+esc(s.title)+'</b> <span class="tag">'+esc(s.type==="route"?"Rota":"Mola")+'</span><div class="muted">'+esc(s.author_name)+' · '+esc(s.bike)+'</div><p style="font-size:12px">'+esc(s.description||"")+'</p>'+(s.type==="route"?'<div class="muted">'+Number(meta.km||0).toFixed(1)+' km · '+esc(meta.duration||"—")+' · '+stops.length+' mola · '+photos.length+' fotoğraf</div>':'')+(photos.length?'<div style="display:grid;grid-template-columns:repeat('+Math.min(3,photos.length)+',1fr);gap:5px;margin-top:8px">'+photos.slice(0,3).map(function(u){return '<img src="'+esc(u)+'" style="width:100%;height:110px;object-fit:cover;border-radius:10px">'}).join("")+'</div>':'')+(stops.length?'<div class="muted" style="margin-top:7px">'+stops.map(function(x){return '☕ '+esc(x.name||"Mola")}).join(' · ')+'</div>':'')+'<div class="actions"><button class="ok" data-ok="'+s.id+'">Onayla</button><button class="no" data-no="'+s.id+'">Reddet</button></div></div>'}).join(""):'<div class="empty">Onay bekleyen gönderi yok.</div>')+
   '<h3 style="margin-top:22px">Üyeler</h3>'+users.slice(0,50).map(function(u){return '<div class="card"><b>'+esc(u.name||"Üye")+'</b><div class="muted">'+esc(u.email||"")+' · '+esc(u.bike||"Motosiklet")+'</div></div>'}).join("");
   app.querySelectorAll("[data-ok]").forEach(function(b){b.onclick=function(){review(b.dataset.ok,"approved")}});
   app.querySelectorAll("[data-no]").forEach(function(b){b.onclick=function(){review(b.dataset.no,"rejected")}});
 }
 async function review(id,status){
   var r=await client.from("submissions").update({status:status,reviewed_at:new Date().toISOString(),reviewed_by:GaZonAuth.state.user.id}).eq("id",id);
   if(r.error){alert(r.error.message);return}await load();
 }
 try{await load()}catch(e){app.innerHTML='<div class="denied"><h2>Admin verileri yüklenemedi</h2><div class="muted danger">'+esc(e.message||e)+'</div></div>'}
})();
</script></body></html>
