plugins { id 'com.android.application' }

def buildCode = (project.findProperty("buildCode") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "1").toString().toInteger()
def buildName = (project.findProperty("buildName") ?: System.getenv("GITHUB_REF_NAME") ?: "1.0.${buildCode}").toString()

android {
    namespace 'com.gazonride.app'
    compileSdk 36

    signingConfigs {
        stableDebug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId 'com.gazonride.app'
        minSdk 24
        targetSdk 36
        multiDexEnabled true
        manifestPlaceholders = [NAVIGATION_API_KEY: (System.getenv('GAZONRIDE_NAVIGATION_API_KEY') ?: 'NAVIGATION_API_KEY_NOT_CONFIGURED')]
        versionCode buildCode
        versionName buildName
    }

    // Navigation SDK 7.3 requires Android API 36, Gradle 8.11.1, AGP 8.10.
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    dexOptions { javaMaxHeapSize '4g' }
    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
}

dependencies {
    implementation 'com.google.android.libraries.navigation:navigation:7.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.3'
}
