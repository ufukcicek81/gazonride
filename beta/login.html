<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><title>GaZonRide Üyelik</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0,0" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f6f8;color:#171a1f;min-height:100vh}.wrap{width:min(470px,100%);margin:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px 30px}.brand{display:flex;align-items:center;gap:10px;margin:10px 0 28px}.mark{width:50px;height:50px;border-radius:16px;background:#ff5a1f;color:#fff;display:grid;place-items:center}.mark span{font-size:30px}.brand b{font-size:27px}.brand em{font-style:normal;color:#ff5a1f}.card{background:#fff;border:1px solid #dfe3e8;border-radius:24px;padding:20px;box-shadow:0 15px 45px #0000000d}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f2f5;border-radius:13px;padding:4px;margin-bottom:16px}.tabs button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:850}.tabs button.active{background:#fff;box-shadow:0 3px 12px #0001}.field{width:100%;border:1px solid #dfe3e8;border-radius:13px;padding:13px 14px;margin-top:9px;font:inherit;outline:0}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;font-weight:900;font-size:15px;background:#ff5a1f;color:#fff}.socials{display:grid;gap:9px;margin-top:14px}.socialBtn{width:100%;border:1px solid #dfe3e8;border-radius:14px;padding:13px;background:#fff;color:#171a1f;font-weight:850;font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px}.socialLogo{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:950}.googleG{font-family:Arial,sans-serif;font-size:18px}.appleA{font-size:23px;line-height:1}.or{display:flex;align-items:center;gap:10px;color:#8a929d;font-size:10px;margin:15px 0 4px}.or:before,.or:after{content:"";height:1px;background:#e2e5e9;flex:1}.muted{font-size:11px;color:#707985;line-height:1.45;margin-top:12px}.msg{display:none;margin-top:12px;padding:11px;border-radius:12px;background:#fff3cd;color:#745600;font-size:11px}.msg.error{background:#fde8e8;color:#972727}.setup{background:#fff;border:1px solid #dfe3e8;border-radius:18px;padding:15px;margin-top:12px;font-size:12px;line-height:1.45}#registerFields{display:none}
</style></head><body><div class="wrap"><div class="brand"><div class="mark"><span class="material-symbols-rounded">two_wheeler</span></div><b>GAZON<em>RIDE</em></b></div><div class="card"><h1 style="margin:0 0 5px;font-size:24px">Hesabına giriş yap</h1><div class="muted" style="margin-top:0">Rotaların, sürüşlerin, grupların ve katkıların hesabına bağlı olsun.</div><div class="tabs"><button class="active" id="loginTab">Giriş</button><button id="registerTab">Üye Ol</button></div><div id="registerFields"><input class="field" id="name" placeholder="Ad soyad"><input class="field" id="bike" placeholder="Motosiklet (örn. KTM 1290)"></div><input class="field" id="email" type="email" autocomplete="email" placeholder="E-posta"><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Şifre (en az 6 karakter)"><button class="btn" id="submit">Giriş Yap</button><button type="button" id="forgotBtn" style="width:100%;border:0;background:transparent;color:#707985;font-weight:800;padding:10px 4px 2px">Şifremi unuttum</button><div class="or"><span>veya</span></div><div class="socials"><button class="socialBtn" id="googleLogin"><span class="socialLogo googleG">G</span>Google ile devam et</button><button class="socialBtn" id="appleLogin"><span class="socialLogo appleA"></span>Apple ile devam et</button></div><div class="msg" id="msg"></div></div></div>
<script src="supabase-config.js?v=20261008-audit1"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20261008-sb5"></script>
<script>
(function(){var mode=new URLSearchParams(location.search).get("recovery")==="1"?"recovery":"login",msg=document.getElementById("msg"),submit=document.getElementById("submit"),reg=document.getElementById("registerFields");
function setMode(m){mode=m;document.getElementById("loginTab").classList.toggle("active",m==="login");document.getElementById("registerTab").classList.toggle("active",m==="register");reg.style.display=m==="register"?"block":"none";submit.textContent=m==="register"?"Üyeliğimi Oluştur":m==="recovery"?"Yeni Şifreyi Kaydet":"Giriş Yap";document.getElementById("email").style.display=m==="recovery"?"none":"block";document.getElementById("forgotBtn").style.display=m==="login"?"block":"none";msg.style.display="none"}
document.getElementById("loginTab").onclick=function(){setMode("login")};document.getElementById("registerTab").onclick=function(){setMode("register")};
document.getElementById("forgotBtn").onclick=async function(){
 var email=document.getElementById("email").value.trim();
 if(!email){msg.textContent="Şifre sıfırlama bağlantısı için e-posta adresini yaz.";msg.className="msg error";msg.style.display="block";return}
 try{await GaZonAuth.resetPassword(email);msg.textContent="Şifre sıfırlama bağlantısı e-postana gönderildi.";msg.className="msg";msg.style.display="block"}catch(e){msg.textContent=e.message||"Bağlantı gönderilemedi.";msg.className="msg error";msg.style.display="block"}
};
async function social(provider){
 msg.style.display="none";
 try{await GaZonAuth.socialLogin(provider)}
 catch(e){msg.textContent=(provider==="google"?"Google":"Apple")+" girişi başlatılamadı: "+(e.message||e);msg.className="msg error";msg.style.display="block"}
}
document.getElementById("googleLogin").onclick=function(){social("google")};
var appleBtn=document.getElementById("appleLogin");if(window.GAZONRIDE_APPLE_ENABLED){appleBtn.onclick=function(){social("apple")};}else{appleBtn.style.display="none";}
var qs=new URLSearchParams(location.search);if(qs.get("oauth_error")){try{msg.textContent=localStorage.getItem("gazon_oauth_error")||"Sosyal giriş tamamlanamadı.";localStorage.removeItem("gazon_oauth_error")}catch(e){msg.textContent="Sosyal giriş tamamlanamadı."}msg.className="msg error";msg.style.display="block"}
submit.onclick=async function(){
 msg.style.display="none";var email=document.getElementById("email").value.trim(),pass=document.getElementById("password").value;
 if(pass.length<6||(mode!=="recovery"&&!email)){msg.textContent=mode==="recovery"?"Yeni şifre en az 6 karakter olmalı.":"E-posta ve en az 6 karakter şifre gerekli.";msg.className="msg error";msg.style.display="block";return}
 submit.disabled=true;
 try{
   if(mode==="recovery"){await GaZonAuth.updatePassword(pass);msg.textContent="Şifren güncellendi. Uygulamaya yönlendiriliyorsun.";msg.className="msg";msg.style.display="block";setTimeout(function(){location.href="index.html"},700)}
   else if(mode==="register"){var rr=await GaZonAuth.register(email,pass,document.getElementById("name").value.trim(),document.getElementById("bike").value.trim());if(rr.needsVerification){msg.textContent="Üyelik oluşturuldu. E-postana gelen doğrulama bağlantısına dokun, sonra giriş yap.";msg.className="msg";msg.style.display="block"}else location.href="index.html"}
   else await GaZonAuth.login(email,pass)
 }catch(e){msg.textContent=e.message||"İşlem tamamlanamadı.";msg.className="msg error";msg.style.display="block"}finally{submit.disabled=false}
};
setMode(mode);
})();
</script></body></html>
