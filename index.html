<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>GazonRide</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--r:#e31b23;--bg:#080a0e;--c:#12151b;--l:#292e37;--m:#929aa7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}.app{max-width:540px;margin:auto;min-height:100vh;padding-bottom:88px}header{padding:17px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:950}.logo span{color:var(--r)}button{font:inherit}.motor,.mode{background:#171b22;color:#ddd;border:1px solid var(--l);border-radius:999px;padding:9px 12px;font-size:11px}.map{height:410px;margin:0 12px;border:1px solid var(--l);border-radius:25px;overflow:hidden;position:relative}#map{position:absolute;inset:0}.leaflet-control-attribution{font-size:8px}.leaflet-control-zoom{display:none}.live{position:absolute;z-index:500;top:12px;left:12px;right:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.live div{background:#07090ddd;border:1px solid #343944;border-radius:14px;padding:8px 9px;backdrop-filter:blur(12px)}.live b{font-size:20px;display:block}.live small{font-size:8px;color:#9da4af}.maptools{position:absolute;right:12px;bottom:12px;z-index:500;display:flex;gap:6px}.maptools button{background:#080a0ee8;color:#fff;border:1px solid #363b45;border-radius:12px;padding:9px;font-size:12px}.location{position:absolute;z-index:500;left:12px;bottom:12px;background:#080a0ee8;border:1px solid #363b45;border-radius:12px;padding:8px 10px;font-size:10px;max-width:60%}.content{padding:18px 16px}.ey{font-size:10px;letter-spacing:2px;color:var(--r);font-weight:900;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:var(--c);border:1px solid var(--l);border-radius:17px;padding:14px}.full{grid-column:1/-1}.big{font-size:28px;font-weight:900}.sub{font-size:10px;color:var(--m);margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:9px;padding:0 16px}.btn{border:0;border-radius:16px;padding:15px;font-weight:900}.dark{background:#191d24;color:#fff;border:1px solid #30353e}.red{background:var(--r);color:#fff}.status{margin:11px 16px;padding:11px;border:1px solid var(--l);border-radius:13px;background:#10131a;color:#a1a8b2;font-size:10px;text-align:center}.history{padding:18px 16px}.ride{display:flex;justify-content:space-between;background:var(--c);border:1px solid var(--l);border-radius:15px;padding:12px;margin-top:7px}.ride small{display:block;color:var(--m);font-size:9px;margin-top:3px}nav{position:fixed;z-index:900;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);background:#080a0ef5;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 7px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}nav div{text-align:center;color:#7f8793;font-size:10px}nav b{display:block;font-size:19px}nav .on{color:#fff}.bikeIcon{font-size:25px;text-shadow:0 2px 5px #000}
</style></head><body><div class="app">
<header><div class="logo">GAZON<span>RIDE</span></div><button class="motor">🏍️ KTM 1290</button></header>
<section class="map"><div id="map"></div><div class="live"><div><b id="speed">0</b><small>KM/SA HIZ</small></div><div><b id="distance">0.00</b><small>KM MESAFE</small></div><div><b id="altitude">—</b><small>M RAKIM</small></div></div><div class="location" id="location">📍 Konum bekleniyor</div><div class="maptools"><button onclick="locateMe()">◎ Konumum</button><button onclick="toggleMap()">🛰️ Uydu</button></div></section>
<section class="content"><div class="ey">AKTİF SÜRÜŞ</div><div class="grid"><div class="card"><div class="big" id="duration">00:00</div><div class="sub">Sürüş süresi</div></div><div class="card"><div class="big" id="avg">0</div><div class="sub">Ortalama hız · km/sa</div></div><div class="card"><div class="big" id="max">0</div><div class="sub">Maksimum hız · km/sa</div></div><div class="card"><div class="big" id="elev">0</div><div class="sub">Tırmanış · m</div></div><div class="card full"><b id="gps">GPS hazır</b><div class="sub" id="accuracy">Konum doğruluğu: —</div></div></div></section>
<div class="actions"><button class="btn dark" onclick="shareRide()">↗ Paylaş</button><button class="btn red" id="startBtn" onclick="toggleRide()">🏍️ Sürüşü Başlat</button></div><div class="status" id="status">Sürüş başlatıldığında gerçek rota haritada çizilecek.</div>
<section class="history"><div class="ey">SON SÜRÜŞLER</div><div id="historyList"></div></section></div>
<nav><div class="on" onclick="scrollTo({top:0,behavior:'smooth'})"><b>🏍️</b>Sürüş</div><div onclick="document.querySelector('.history').scrollIntoView({behavior:'smooth'})"><b>🗺️</b>Rotalar</div><div><b>👥</b>Gruplar</div><div><b>👤</b>Profil</div></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let riding=false,watchId=null,startTime=0,lastPoint=null,totalKm=0,maxSpeed=0,totalClimb=0,prevAlt=null,timer=null,track=[],map,marker,route,satellite=false,tile;
const $=x=>document.getElementById(x);
function init(){map=L.map('map',{zoomControl:false}).setView([39,35],6);tile=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);route=L.polyline([],{color:'#e31b23',weight:5,opacity:.95}).addTo(map);renderHistory()}
function toggleMap(){if(satellite){map.removeLayer(tile);tile=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map)}else{map.removeLayer(tile);tile=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}satellite=!satellite}
function locateMe(){if(!navigator.geolocation)return;$('status').textContent='Konum aranıyor...';navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],16);$('location').textContent='📍 '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)},()=>{$('status').textContent='Konum izni alınamadı.'},{enableHighAccuracy:true,timeout:10000})}
function hav(a,b){const R=6371,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lon-a.lon)*p,x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmt(s){let m=Math.floor(s/60),h=Math.floor(m/60);m%=60;return h?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function toggleRide(){riding?finishRide():startRide()}
function startRide(){if(!navigator.geolocation){$('status').textContent='GPS desteklenmiyor.';return}riding=true;startTime=Date.now();lastPoint=null;totalKm=0;maxSpeed=0;totalClimb=0;prevAlt=null;track=[];route.setLatLngs([]);$('startBtn').textContent='⏹️ Sürüşü Bitir';$('gps').textContent='GPS aranıyor';$('status').textContent='GPS aktif. Güvenli sürüşler!';timer=setInterval(()=>$('duration').textContent=fmt(Math.floor((Date.now()-startTime)/1000)),1000);watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
function onPos(pos){const c=pos.coords,p={lat:c.latitude,lon:c.longitude};track.push([p.lat,p.lon]);$('location').textContent='📍 '+p.lat.toFixed(5)+', '+p.lon.toFixed(5);$('gps').textContent='GPS bağlı';$('accuracy').textContent='Konum doğruluğu: ±'+Math.round(c.accuracy||0)+' m';if(!marker)marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'bikeIcon',html:'🏍️',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);else marker.setLatLng([p.lat,p.lon]);if(track.length===1)map.setView([p.lat,p.lon],16);route.setLatLngs(track);if(track.length>1)map.panTo([p.lat,p.lon],{animate:true,duration:.3});if(c.altitude!=null){$('altitude').textContent=Math.round(c.altitude);if(prevAlt!=null&&c.altitude>prevAlt)totalClimb+=c.altitude-prevAlt;prevAlt=c.altitude;$('elev').textContent=Math.round(totalClimb)}const sp=c.speed!=null&&c.speed>=0?c.speed*3.6:0;$('speed').textContent=Math.round(sp);maxSpeed=Math.max(maxSpeed,sp);$('max').textContent=Math.round(maxSpeed);if(lastPoint){const d=hav(lastPoint,p);if(d<1)totalKm+=d;$('distance').textContent=totalKm.toFixed(2)}lastPoint=p;const h=(Date.now()-startTime)/3600000;$('avg').textContent=h?Math.round(totalKm/h):0}
function onErr(){ $('gps').textContent='GPS hatası';$('status').textContent='GPS alınamadı. Konum iznini ve HTTPS bağlantısını kontrol et.'}
function finishRide(){riding=false;if(watchId!==null)navigator.geolocation.clearWatch(watchId);clearInterval(timer);$('startBtn').textContent='🏍️ Yeni Sürüş';const ride={km:totalKm,duration:$('duration').textContent,max:Math.round(maxSpeed),elev:Math.round(totalClimb),date:new Date().toLocaleString('tr-TR'),track};const rs=JSON.parse(localStorage.getItem('gazon_rides')||'[]');rs.unshift(ride);localStorage.setItem('gazon_rides',JSON.stringify(rs.slice(0,10)));renderHistory();$('status').textContent='Sürüş tamamlandı: '+totalKm.toFixed(1)+' km'}
function shareRide(){const t='GazonRide 🏍️\n'+totalKm.toFixed(1)+' km · '+$('duration').textContent+' · Max '+Math.round(maxSpeed)+' km/sa';if(navigator.share)navigator.share({title:'GazonRide sürüşüm',text:t}).catch(()=>{});else navigator.clipboard?.writeText(t)}
function renderHistory(){const rs=JSON.parse(localStorage.getItem('gazon_rides')||'[]');$('historyList').innerHTML=rs.length?rs.map(r=>'<div class="ride"><div><b>'+Number(r.km).toFixed(1)+' km</b><small>'+r.date+' · '+r.duration+'</small></div><div><b>'+r.max+' km/sa</b><small>Max hız</small></div></div>').join(''):'<div class="sub">Henüz kayıtlı sürüş yok.</div>'}
init();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
