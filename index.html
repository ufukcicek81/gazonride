<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="64x64" href="android/app/src/main/res/drawable/gazonride_logo.png?v=20261008">
<link rel="apple-touch-icon" sizes="64x64" href="android/app/src/main/res/drawable/gazonride_logo.png?v=20261008">
<link rel="manifest" href="manifest.webmanifest?v=20261008">
<title>GazonRide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--red:#e31b23;--bg:#080a0e;--card:#12151b;--line:#2b3039;--muted:#949ca8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100vh}.app{max-width:540px;margin:auto;padding-bottom:92px}
header{height:72px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:950}.logo span{color:var(--red)}
.motor{border:1px solid var(--line);background:#171b22;color:#fff;border-radius:22px;padding:9px 12px;font-size:11px}
.map{height:410px;margin:0 12px;border:1px solid var(--line);border-radius:25px;overflow:hidden;position:relative;background:#18201d}
#map{position:absolute;inset:0}.leaflet-control-attribution{font-size:8px}.leaflet-control-zoom{display:none}
.live{position:absolute;z-index:500;top:12px;left:12px;right:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.liveBox{background:#080a0ee8;border:1px solid #3a3f48;border-radius:15px;padding:9px}.liveBox b{font-size:20px;display:block}.liveBox small{font-size:8px;color:#a1a8b3}
.mapBottom{position:absolute;z-index:500;left:12px;right:12px;bottom:12px;display:flex;gap:7px;align-items:center}
.loc{background:#080a0ee8;border:1px solid #3a3f48;color:#fff;border-radius:13px;padding:10px;font-size:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapBtn{background:#080a0ee8;border:1px solid #3a3f48;color:#fff;border-radius:13px;padding:10px;font-size:11px}
.content{padding:20px 16px}.ey{font-size:10px;letter-spacing:2px;color:var(--red);font-weight:900;margin-bottom:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.full{grid-column:1/-1}
.big{font-size:29px;font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;padding:0 16px}.btn{border-radius:17px;padding:16px;font-weight:900;font-size:14px}.dark{background:#191d24;color:#fff;border:1px solid #343943}.red{background:var(--red);color:#fff;border:0}
.status{margin:12px 16px;padding:12px;border-radius:14px;background:#10131a;border:1px solid var(--line);color:#a5acb6;font-size:11px;text-align:center}
.history{padding:20px 16px}.ride{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:8px;display:flex;justify-content:space-between}.ride small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.bottom{position:fixed;z-index:1000;left:50%;bottom:0;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#080a0ef8;border-top:1px solid var(--line);padding:9px 5px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}
.navBtn{border:0;background:transparent;color:#737b87;font-size:10px;padding:5px;cursor:pointer}.navBtn b{display:block;font-size:21px;margin-bottom:2px}.navBtn.active{color:#fff}
.bikeIcon{font-size:25px;text-shadow:0 2px 5px #000}.screen{display:none;padding:18px 16px 30px}.screen.active{display:block}.screenHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.screenTitle{font-size:22px;font-weight:900}.screenCard{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:10px}.screenBtn{width:100%;border:0;border-radius:13px;padding:13px;background:var(--red);color:#fff;font-weight:800;margin-top:8px}.screenBtn.dark{background:#191d24;border:1px solid #343943}.input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0c0f14;color:#fff;outline:none;margin-top:7px}.statRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.statBox{background:#0d1015;border:1px solid var(--line);border-radius:13px;padding:12px}.statBox b{font-size:20px;display:block}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">GAZON<span>RIDE</span></div><button class="motor" id="motorBtn">🏍️ KTM 1290</button></header>
<section class="map">
<div id="map"></div>
<div class="live">
<div class="liveBox"><b id="speed">0</b><small>KM/SA HIZ</small></div>
<div class="liveBox"><b id="distance">0.00</b><small>KM MESAFE</small></div>
<div class="liveBox"><b id="altitude">—</b><small>M RAKIM</small></div>
</div>
<div class="mapBottom"><div class="loc" id="location">📍 Konum aranıyor...</div><button class="mapBtn" id="locBtn">◎ Konumum</button><button class="mapBtn" id="satBtn">🛰️ Uydu</button></div>
</section>
<section class="content"><div class="ey">AKTİF SÜRÜŞ</div><div class="grid">
<div class="card"><div class="big" id="duration">00:00</div><div class="sub">Sürüş süresi</div></div>
<div class="card"><div class="big" id="avg">0</div><div class="sub">Ortalama hız · km/sa</div></div>
<div class="card"><div class="big" id="max">0</div><div class="sub">Maksimum hız · km/sa</div></div>
<div class="card"><div class="big" id="elev">0</div><div class="sub">Tırmanış · m</div></div><div class="card"><div class="big" id="turns">0</div><div class="sub">Toplam viraj</div></div>
<div class="card full"><b id="gps">GPS aranıyor...</b><div class="sub" id="accuracy">Konum doğruluğu: —</div></div>
</div></section>
<div class="actions"><button class="btn dark" id="shareBtn">↗ Paylaş</button><button class="btn red" id="startBtn">🏍️ Sürüşü Başlat</button></div>
<div class="status" id="status">Uygulama açılır açılmaz konumunuz bulunuyor.</div>
<section class="history"><div class="ey">SON SÜRÜŞLER</div><div id="historyList"></div></section>
</div>
<section id="screen" class="screen"></section><audio id="remoteAudio" autoplay playsinline></audio><nav class="bottom">
<button class="navBtn active" data-page="ride"><b>🏍️</b>Sürüş</button>
<button class="navBtn" data-page="routes"><b>🗺️</b>Rotalar</button>
<button class="navBtn" data-page="groups"><b>👥</b>Gruplar</button><button class="navBtn" data-page="voice"><b>🎙️</b>Intercom</button>
<button class="navBtn" data-page="profile"><b>👤</b>Profil</button>
</nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";
var riding=false,watchId=null,startTime=0,lastPoint=null,totalKm=0,maxSpeed=0,totalClimb=0,turnCount=0,prevAlt=null,timer=null,track=[],map=null,marker=null,route=null,satellite=false,tile=null,lastGpsTs=0;
function $(id){return document.getElementById(id);}
function hav(a,b){var R=6371,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lon-a.lon)*p,x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)*Math.sin(dLon/2);return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b){var p=Math.PI/180,y1=a.lat*p,y2=b.lat*p,dl=(b.lon-a.lon)*p;return (Math.atan2(Math.sin(dl)*Math.cos(y2),Math.cos(y1)*Math.sin(y2)-Math.sin(y1)*Math.cos(y2)*Math.cos(dl))*180/Math.PI+360)%360;}
function angleDiff(a,b){var d=Math.abs(a-b)%360;return d>180?360-d:d;}
function updateTurns(){if(track.length<3)return;var n=track.length-1,a=track[n-2],b=track[n-1],c=track[n],d1=hav({lat:a[0],lon:a[1]},{lat:b[0],lon:b[1]}),d2=hav({lat:b[0],lon:b[1]},{lat:c[0],lon:c[1]});if(d1<0.015||d2<0.015)return;var turn=angleDiff(bearing({lat:a[0],lon:a[1]},{lat:b[0],lon:b[1]}),bearing({lat:b[0],lon:b[1]},{lat:c[0],lon:c[1]}));if(turn>=25&&turn<=160){var last=track._lastTurn||0;if(n-last>=4){turnCount++;track._lastTurn=n;$("turns").textContent=turnCount;}}}
function fmt(s){var m=Math.floor(s/60),h=Math.floor(m/60);m=m%60;return h?String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0"):String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function initMap(){
 if(typeof L==="undefined"){$("status").textContent="Harita yüklenemedi. İnternet bağlantısını kontrol edin.";return false;}
 map=L.map("map",{zoomControl:false}).setView([39,35],6);
 tile=L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors © CARTO"}).addTo(map);
 route=L.polyline([],{color:"#e31b23",weight:5,opacity:.95}).addTo(map);
 return true;
}
function applyPosition(pos){
 var c=pos.coords,p={lat:c.latitude,lon:c.longitude};
 $("location").textContent="📍 "+p.lat.toFixed(5)+", "+p.lon.toFixed(5);
 $("gps").textContent="GPS bağlı";
 $("accuracy").textContent="Konum doğruluğu: ±"+Math.round(c.accuracy||0)+" m";
 if(map){if(!marker){marker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:"bikeIcon",html:"🏍️",iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);}else marker.setLatLng([p.lat,p.lon]);}
 if(map&&!riding)map.setView([p.lat,p.lon],16);
 if(riding){
   track.push([p.lat,p.lon]);updateTurns();route.setLatLngs(track);
   if(track.length>1)map.panTo([p.lat,p.lon],{animate:true,duration:.25});
   if(lastPoint){
 var d=hav(lastPoint,p),dt=lastGpsTs?Math.max(0.5,(Date.now()-lastGpsTs)/1000):1;
 var acc=Number(c.accuracy||999),implied=dt>0?(d*3600/dt):999;
 if(d>0.003 && d<0.8 && (acc<=80 || implied<=180)) totalKm+=d;
 $("distance").textContent=totalKm.toFixed(2);
}
lastGpsTs=Date.now();
   lastPoint=p;
   var sp=c.speed!=null&&c.speed>=0?c.speed*3.6:0;$("speed").textContent=Math.round(sp);maxSpeed=Math.max(maxSpeed,sp);$("max").textContent=Math.round(maxSpeed);
   if(c.altitude!=null){$("altitude").textContent=Math.round(c.altitude);if(prevAlt!=null&&c.altitude>prevAlt)totalClimb+=c.altitude-prevAlt;prevAlt=c.altitude;$("elev").textContent=Math.round(totalClimb);}
   var hours=(Date.now()-startTime)/3600000;$("avg").textContent=hours?Math.round(totalKm/hours):0;
 }
}
function startGPS(){
 if(!navigator.geolocation){$("gps").textContent="GPS desteklenmiyor";$("location").textContent="📍 GPS kullanılamıyor";return;}
 $("gps").textContent="Konum aranıyor...";
 navigator.geolocation.getCurrentPosition(function(pos){applyPosition(pos);$("status").textContent="Konum bulundu. Sürüşe hazırsın.";},function(err){$("gps").textContent="Konum bekleniyor";$("status").textContent=err.code===1?"Konum izni verilmedi. Tarayıcı ayarlarından izin verin.":"GPS sinyali aranıyor...";},{enableHighAccuracy:false,maximumAge:30000,timeout:5000});
 navigator.geolocation.getCurrentPosition(function(pos){applyPosition(pos);},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
function startRide(){
 if(!navigator.geolocation){$("status").textContent="Bu cihazda GPS kullanılamıyor.";return;}
 riding=true;startTime=Date.now();lastPoint=null;lastGpsTs=0;totalKm=0;maxSpeed=0;totalClimb=0;turnCount=0;prevAlt=null;track=[];track._lastTurn=0;
 route&&route.setLatLngs([]);$("distance").textContent="0.00";$("duration").textContent="00:00";$("avg").textContent="0";$("max").textContent="0";$("elev").textContent="0";$("turns").textContent="0";
 $("startBtn").textContent="⏹️ Sürüşü Bitir";$("gps").textContent="GPS aranıyor";$("status").textContent="Sürüş başladı. GPS takip ediyor.";
 timer=setInterval(function(){$("duration").textContent=fmt(Math.floor((Date.now()-startTime)/1000));},1000);
 watchId=navigator.geolocation.watchPosition(applyPosition,function(){$("gps").textContent="GPS hatası";},{enableHighAccuracy:true,maximumAge:1000,timeout:15000}); if(window.AndroidBridge&&window.AndroidBridge.startRide)try{window.AndroidBridge.startRide();}catch(e){}
}
function finishRide(){
 riding=false;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;clearInterval(timer);
 $("startBtn").textContent="🏍️ Yeni Sürüş";$("status").textContent="Sürüş tamamlandı: "+totalKm.toFixed(1)+" km";
 var ride={km:totalKm,duration:$("duration").textContent,max:Math.round(maxSpeed),elev:Math.round(totalClimb),turns:turnCount,date:new Date().toLocaleString("tr-TR"),track:track};
 if(window.AndroidBridge&&window.AndroidBridge.stopRide)try{window.AndroidBridge.stopRide();}catch(e){} var rs=JSON.parse(localStorage.getItem("gazon_rides")||"[]");rs.unshift(ride);localStorage.setItem("gazon_rides",JSON.stringify(rs.slice(0,10)));renderHistory();
}
function renderHistory(){var rs=JSON.parse(localStorage.getItem("gazon_rides")||"[]");$("historyList").innerHTML=rs.length?rs.map(function(r){return '<div class="ride"><div><b>'+Number(r.km).toFixed(1)+' km</b><small>'+r.date+" · "+r.duration+'</small></div><div><b>'+r.max+" km/sa</b><small>Max hız</small></div><div><b>"+Number(r.turns||0)+"</b><small>Viraj</small></div></div>";}).join(""):'<div class="sub">Henüz kayıtlı sürüş yok.</div>';}
function shareRide(){var t="GazonRide 🏍️\n"+totalKm.toFixed(1)+" km · "+$("duration").textContent+" · Max "+Math.round(maxSpeed)+" km/sa";if(navigator.share)navigator.share({title:"GazonRide sürüşüm",text:t}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t);}
function locate(){if(!navigator.geolocation)return;startGPS();if(map)map.invalidateSize();}
function toggleSatellite(){if(!map)return;if(satellite){map.removeLayer(tile);tile=L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors © CARTO"}).addTo(map);}else{map.removeLayer(tile);tile=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"}).addTo(map);}satellite=!satellite;}
function closeScreen(){var x=$("screen");x.classList.remove("active");x.innerHTML="";window.scrollTo({top:0,behavior:"smooth"});}
var voice={ws:null,room:"",id:"",stream:null,mic:false,peers:{},remoteCount:0};
var VOICE_WS="wss://gazonride-voice.onrender.com";
function voiceId(){return "rider-"+Math.random().toString(36).slice(2,9);}
function sendSignal(msg){if(voice.ws&&voice.ws.readyState===1)voice.ws.send(JSON.stringify(msg));}
function pcFor(id,offer){
  if(voice.peers[id]) return voice.peers[id];
  var pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  voice.peers[id]=pc;
  if(voice.stream)voice.stream.getTracks().forEach(function(t){pc.addTrack(t,voice.stream);});
  pc.onicecandidate=function(e){if(e.candidate)sendSignal({type:"signal",to:id,data:{kind:"ice",candidate:e.candidate}});};
  pc.ontrack=function(e){if(e.streams&&e.streams[0])playRemote(e.streams[0],id);};
  pc.onconnectionstatechange=function(){if(["failed","closed","disconnected"].indexOf(pc.connectionState)>=0){delete voice.peers[id];updateVoiceCount();}};
  if(offer)pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).then(function(){sendSignal({type:"signal",to:id,data:{kind:"offer",sdp:pc.localDescription}});}).catch(function(){});
  return pc;
}
async function handleSignal(m){
  var d=m.data,pc=pcFor(m.from,false);
  try{
    if(d.kind==="offer"){await pc.setRemoteDescription(d.sdp);var a=await pc.createAnswer();await pc.setLocalDescription(a);sendSignal({type:"signal",to:m.from,data:{kind:"answer",sdp:pc.localDescription}});}
    else if(d.kind==="answer"){await pc.setRemoteDescription(d.sdp);}
    else if(d.kind==="ice"&&d.candidate){await pc.addIceCandidate(d.candidate);}
  }catch(e){console.warn("voice signal",e);}
}
function updateVoiceCount(){var n=Object.keys(voice.peers).length+1;$("voiceCount").textContent=n;}
function voiceUI(){return '<div class="screenHead"><div><div class="ey">GRUP SÜRÜŞÜ</div><div class="screenTitle">Intercom</div></div><button class="mapBtn" id="closeScreen">✕</button></div><div class="screenCard"><b>Marka bağımsız grup konuşması</b><div class="sub">Cardo, Sena, Midland ve diğer Bluetooth kulaklıklar telefon üzerinden aynı ses grubuna bağlanabilir.</div><input class="input" id="roomCode" placeholder="Grup kodu (örn. GAZON123)"><button class="screenBtn" id="createVoice">＋ Grup Oluştur</button><button class="screenBtn dark" id="joinVoice">Gruba Katıl</button></div><div class="screenCard"><div class="statRow"><div class="statBox"><b id="voiceState">Bağlı değil</b><span class="sub">Ses durumu</span></div><div class="statBox"><b id="voiceCount">0</b><span class="sub">Bağlı sürücü</span></div></div><button class="screenBtn" id="micBtn">🎙️ Mikrofonu Aç</button><div class="sub" style="margin-top:10px">Ses bağlantısı internet üzerinden çalışır. Bluetooth intercom telefona bağlı olmalıdır.</div></div><div class="screenCard"><b>Bağlantı kodu</b><div class="sub" id="voiceCode">—</div></div>';}
function setupVoice(){
 $("closeScreen").onclick=closeScreen;
 $("createVoice").onclick=function(){var c=$("roomCode").value.trim().toUpperCase()||("GAZON"+Math.random().toString(36).slice(2,8).toUpperCase());startVoice(c,true);};
 $("joinVoice").onclick=function(){var c=$("roomCode").value.trim().toUpperCase();if(c)startVoice(c,false);else $("voiceState").textContent="Kod gerekli";};
 $("micBtn").onclick=toggleMic;
}
async function startVoice(code,host){
 try{
  if(!window.RTCPeerConnection||!window.WebSocket||!navigator.mediaDevices){$("voiceState").textContent="Bu cihaz tarayıcı sesini desteklemiyor";return;}
  await ensureMic();
  if(voice.ws)voice.ws.close();
  Object.keys(voice.peers).forEach(function(id){try{voice.peers[id].close();}catch(e){}});voice.peers={};
  voice.room=code;voice.id=voiceId();
  voice.ws=new WebSocket(VOICE_WS);
  voice.ws.onopen=function(){sendSignal({type:"join",room:code,id:voice.id,name:"GazonRide"});$("voiceCode").textContent=code;$("voiceState").textContent=host?"Grup hazır":"Gruba bağlanıyor";};
  voice.ws.onmessage=async function(ev){var m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==="members"){(m.members||[]).forEach(function(p){if(p.id!==voice.id)pcFor(p.id,true);});updateVoiceCount();}
    else if(m.type==="peer-joined"){updateVoiceCount();}
    else if(m.type==="signal")await handleSignal(m);
    else if(m.type==="peer-left"){if(voice.peers[m.id]){voice.peers[m.id].close();delete voice.peers[m.id];}updateVoiceCount();}
  };
  voice.ws.onerror=function(){$("voiceState").textContent="Sunucu bağlantı hatası";};
  voice.ws.onclose=function(){if(voice.room)$("voiceState").textContent="Bağlantı kapandı";};
  voice.mic=false;voice.stream.getAudioTracks().forEach(function(t){t.enabled=false;});$("micBtn").textContent="🎙️ Mikrofonu Aç";
 }catch(e){$("voiceState").textContent="Mikrofon izni gerekli";}
}
async function ensureMic(){if(voice.stream)return voice.stream;voice.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});return voice.stream;}
async function toggleMic(){try{var st=await ensureMic();voice.mic=!voice.mic;st.getAudioTracks().forEach(function(t){t.enabled=voice.mic;});$("micBtn").textContent=voice.mic?"🔴 Konuşmayı Kapat":"🎙️ Mikrofonu Aç";$("voiceState").textContent=voice.mic?"Konuşuyorsun":"Dinlemede";}catch(e){$("voiceState").textContent="Mikrofon izni gerekli";}}
function playRemote(stream,id){var a=document.getElementById("remote-"+id);if(!a){a=document.createElement("audio");a.id="remote-"+id;a.autoplay=true;a.playsInline=true;a.controls=false;a.style.display="none";document.body.appendChild(a);}a.srcObject=stream;a.play().catch(function(){});updateVoiceCount();}
function showScreen(page){
 var x=$("screen");x.classList.add("active");
 if(page==="routes"){
   var rs=JSON.parse(localStorage.getItem("gazon_rides")||"[]");
   x.innerHTML='<div class="screenHead"><div><div class="ey">ROTALAR</div><div class="screenTitle">Sürüş Geçmişim</div></div><button class="mapBtn" id="closeScreen">✕</button></div>'+
   (rs.length?rs.map(function(r,i){return '<div class="screenCard"><div style="display:flex;justify-content:space-between"><div><b>'+Number(r.km).toFixed(1)+' km</b><div class="sub">'+r.date+'</div></div><div><b>'+r.max+' km/sa</b><div class="sub">'+r.duration+'</div></div></div><button class="screenBtn dark" data-route="'+i+'">🗺️ Rotayı Haritada Göster</button><button class="screenBtn dark" data-google="'+i+'">📍 Google Haritalar'da Aç</button></div>';}).join(""):'<div class="screenCard"><b>Henüz rota yok</b><div class="sub">İlk sürüşünü başlat ve burada sakla.</div></div>');
   x.querySelector("#closeScreen").onclick=closeScreen;
   x.querySelectorAll("[data-google]").forEach(function(b){b.onclick=function(){
 var a=JSON.parse(localStorage.getItem("gazon_rides")||"[]")[Number(b.getAttribute("data-google"))];
 if(!a||!a.track||a.track.length<2)return;
 var pts=a.track.filter(function(p){return Array.isArray(p)&&p.length>=2;});
 var origin=pts[0][0]+","+pts[0][1], dest=pts[pts.length-1][0]+","+pts[pts.length-1][1], mids=[];
 for(var k=1;k<=3;k++){var idx=Math.round((pts.length-1)*k/4);if(idx>0&&idx<pts.length-1)mids.push(pts[idx][0]+","+pts[idx][1]);}
 var url="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(origin)+"&destination="+encodeURIComponent(dest)+"&travelmode=driving";
 if(mids.length)url+="&waypoints="+encodeURIComponent(mids.join("|"));
 window.open(url,"_blank");
};});
x.querySelectorAll("[data-route]").forEach(function(b){b.onclick=function(){var a=JSON.parse(localStorage.getItem("gazon_rides")||"[]")[Number(b.getAttribute("data-route"))];if(a&&a.track&&a.track.length&&map){closeScreen();route.setLatLngs(a.track);map.fitBounds(route.getBounds(),{padding:[25,25]});window.scrollTo({top:0,behavior:"smooth"});$("status").textContent="Kayıtlı rota haritada gösteriliyor.";}}});
 }else if(page==="groups"){
   var groups=JSON.parse(localStorage.getItem("gazon_groups")||"[]");
   x.innerHTML='<div class="screenHead"><div><div class="ey">SOSYAL SÜRÜŞ</div><div class="screenTitle">Gruplar</div></div><button class="mapBtn" id="closeScreen">✕</button></div><div class="screenCard"><b>Yeni grup oluştur</b><input class="input" id="groupName" placeholder="Grup adı"><button class="screenBtn" id="createGroup">＋ Grup Oluştur</button></div><div class="screenCard"><b>Gruba katıl</b><input class="input" id="groupCode" placeholder="Davet kodu"><button class="screenBtn dark" id="joinGroup">Katıl</button></div><div class="ey">GRUPLARIM</div>'+(groups.length?groups.map(function(g){return '<div class="screenCard"><b>🏍️ '+g.name+'</b><div class="sub">Kod: '+g.code+' · '+g.members+' sürücü</div></div>';}).join(""):'<div class="screenCard"><div class="sub">Henüz bir grubun yok.</div></div>');
   x.querySelector("#closeScreen").onclick=closeScreen;
   x.querySelector("#createGroup").onclick=function(){var n=x.querySelector("#groupName").value.trim();if(!n)return;x.querySelector("#groupName").value="";groups.push({name:n,code:"GR"+Math.random().toString(36).slice(2,7).toUpperCase(),members:1});localStorage.setItem("gazon_groups",JSON.stringify(groups));showScreen("groups");};
   x.querySelector("#joinGroup").onclick=function(){var c=x.querySelector("#groupCode").value.trim().toUpperCase();if(!c)return;$("status").textContent="Davet kodu kontrol ediliyor: "+c;};
 }else if(page==="voice"){x.innerHTML=voiceUI();setupVoice();}else if(page==="profile"){
   var p=JSON.parse(localStorage.getItem("gazon_profile")||'{"name":"GazonRide sürücüsü","bike":"KTM 1290"}'),rs=JSON.parse(localStorage.getItem("gazon_rides")||"[]"),km=rs.reduce(function(a,r){return a+Number(r.km||0)},0);
   x.innerHTML='<div class="screenHead"><div><div class="ey">SÜRÜCÜ PROFİLİ</div><div class="screenTitle">Profilim</div></div><button class="mapBtn" id="closeScreen">✕</button></div><div class="screenCard"><b>👤 Sürücü bilgileri</b><input class="input" id="profileName" value="'+p.name.replace(/"/g,"&quot;")+'" placeholder="Adınız"><input class="input" id="profileBike" value="'+p.bike.replace(/"/g,"&quot;")+'" placeholder="Motosiklet"><button class="screenBtn" id="saveProfile">Kaydet</button></div><div class="statRow"><div class="statBox"><b>'+rs.length+'</b><span class="sub">Sürüş</span></div><div class="statBox"><b>'+km.toFixed(1)+'</b><span class="sub">Toplam km</span></div></div>';
   x.querySelector("#closeScreen").onclick=closeScreen;
   x.querySelector("#saveProfile").onclick=function(){localStorage.setItem("gazon_profile",JSON.stringify({name:x.querySelector("#profileName").value||"GazonRide sürücüsü",bike:x.querySelector("#profileBike").value||"Motosiklet"}));$("motorBtn").textContent="🏍️ "+x.querySelector("#profileBike").value; $("status").textContent="Profil kaydedildi.";};
 }
 x.scrollIntoView({behavior:"smooth"});
}
function nav(page,button){
 document.querySelectorAll(".navBtn").forEach(function(b){b.classList.remove("active");});button.classList.add("active");
 if(page==="ride"){closeScreen();window.scrollTo({top:0,behavior:"smooth"});}
 else showScreen(page);
}
function boot(){
 if(!initMap())return;
 if(window.AndroidBridge&&window.AndroidBridge.getBufferedPoints){
  try{var raw=window.AndroidBridge.getBufferedPoints(),bg=JSON.parse(raw||"[]");
   if(bg.length){bg.forEach(function(p){applyPosition({coords:{latitude:p.lat,longitude:p.lon,accuracy:p.accuracy||20,altitude:p.altitude,speed:p.speed,timestamp:p.time}});});window.AndroidBridge.clearBufferedPoints();}
  }catch(e){}
 }
 renderHistory();
 $("startBtn").addEventListener("click",function(){if(riding)finishRide();else startRide();});
 $("shareBtn").addEventListener("click",shareRide);
 $("locBtn").addEventListener("click",locate);
 $("satBtn").addEventListener("click",toggleSatellite);
 document.querySelectorAll(".navBtn").forEach(function(b){b.addEventListener("click",function(){nav(b.getAttribute("data-page"),b);});});
 startGPS();
 setTimeout(function(){if(map)map.invalidateSize();},500);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
</body>
</html>
