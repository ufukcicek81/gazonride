name: GaZonRide
options:
  bundleIdPrefix: com.gazonride
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  GaZonRide:
    type: application
    platform: iOS
    sources:
      - GaZonRide
    info:
      path: GaZonRide/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gazonride.app
        PRODUCT_NAME: GaZonRide
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: GaZonRide/GaZonRide.entitlements
